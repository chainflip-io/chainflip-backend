on:
  workflow_call:
    inputs:
      ci-runner:
        default: rust-builder-light
        description: The CI runner to use
        type: string

env:
  FORCE_COLOR: 1
  CARGO_TERM_COLOR: always
jobs:
  unit-tests:
    runs-on: namespace-profile-${{ inputs.ci-runner }}
    container:
      image: "nscr.io/n0ie27k9ikobs/chainflip-backend/rust-base:nightly-2026-01-06"
      volumes:
        - /cache:/cache
      options: --cap-add=SYS_ADMIN
      env:
        NSC_CACHE_PATH: "/cache"
    strategy:
      matrix:
        cargo-profile:
          - cf-test-ci
          - cf-test-ci-nextest
    steps:
      - name: Checkout 🛒
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This is a workaround for the issue with Git ownership that prevents cargo from executing git commands
      - name: Configure Git 🛠️
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up Rust cache 🦀💰
        if: contains(inputs.ci-runner, 'no-cache') == false
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust

      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      - name: Install Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Build TypeScript Signer for Ethereum EIP712 tests
        working-directory: state-chain/ethereum-eip712/ts-signer
        run: |
          bun install

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest@0.9.92

      - name: Run tests 🧪
        run: |
          cargo ${{ matrix.cargo-profile }} --locked
        timeout-minutes: 30
