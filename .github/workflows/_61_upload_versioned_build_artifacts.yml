on:
  workflow_call:
    inputs:
      is_release:
        type: boolean
        default: true
      is_development:
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
jobs:
  upload:
    runs-on: namespace-profile-default-light

    steps:
      - name: Checkout 🛒
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Artifacts 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: chainflip-backend-bin*
          merge-multiple: false

      # download-artifact (v5+) skips the per-artifact directory when the pattern matches a single
      # artifact. Callers depend on `build`, so a lone match is always chainflip-backend-bin.
      - name: Nest single artifact 📁
        run: |
          if [[ ! -d artifacts/chainflip-backend-bin ]]; then
            mv artifacts chainflip-backend-bin
            mkdir artifacts
            mv chainflip-backend-bin artifacts/
          fi

      - name: Set Version 🔦
        id: version
        run: |
          chmod +x artifacts/chainflip-backend-bin/chainflip-node
          if [[ ${{ inputs.is_release }} == true ]]; then
            VERSION=$(./ci/scripts/extract_version.sh "$(artifacts/chainflip-backend-bin/chainflip-node --version)" full)
          elif [[ ${{ github.event_name }} == pull_request ]]; then
            VERSION=${{ github.event.pull_request.head.sha }}
          else
            VERSION=${{ github.sha }}
          fi
          echo "Version: $VERSION"
          echo "s3_prefix=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download runtime 📥
        if: inputs.is_release == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chainflip-node-runtime-production-${{ steps.version.outputs.version }}
          path: artifacts

      - name: Debug Artifacts 🐛
        run: |
          ls -laR artifacts

      - name: Compress Artifacts into Zip Files 📦
        run: |
          find ./artifacts -name "*.so" -o -name "*.dylib" | xargs -n1 -I% cp -v % ./artifacts
          find ./artifacts -mindepth 1 -maxdepth 1 -type d | xargs -I % zip -rm "%.zip" "%"

      - name: Configure AWS credentials using OIDC 🪪
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::962042992619:role/chainflip-github-bot

      - name: Upload Artifacts S3 🚀
        run: |
          aws s3 sync ./artifacts/ "s3://artifacts.chainflip.io/${s3_prefix}/"

      - name: Upload Artifacts S3 (main Alias) 🚀
        if: inputs.is_release == false && inputs.is_development == false
        run: |
          aws s3 sync "s3://artifacts.chainflip.io/${s3_prefix}/" s3://artifacts.chainflip.io/main/

      - name: Upload Development Artifacts S3 🚀
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        if: inputs.is_release == false && inputs.is_development == true
        run: |
          aws s3 sync "s3://artifacts.chainflip.io/${s3_prefix}/" "s3://artifacts.chainflip.io/${BRANCH_NAME}/"
