on:
  workflow_call:
    inputs:
      network:
        description: Network being released
        required: true
        type: string
      ci-runner:
        default: rust-builder-light
        description: The CI runner to use
        type: string

env:
  FORCE_COLOR: 1
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  packages:
    runs-on: namespace-profile-${{ inputs.ci-runner }}
    timeout-minutes: 30
    container:
      image: "nscr.io/n0ie27k9ikobs/chainflip-backend/rust-base:nightly-2026-01-06"
      volumes:
        - /cache:/cache
      options: --cap-add=SYS_ADMIN
      env:
        NSC_CACHE_PATH: "/cache"
    steps:
      - name: Checkout 🛒
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust cache 🦀💰
        if: contains(inputs.ci-runner, 'no-cache') == false
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust

      - name: Download binaries from same run 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chainflip-backend-bin
          path: ./target/release

      - name: Get date
        id: get-date
        run: |
          echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Build global packages 🌍
        env:
          DEB_REVISION: ${{ steps.get-date.outputs.date }}
          NETWORK: ${{ inputs.network }}
        run: |
          rm -f target/debian/*.deb
          cargo deb -v --no-build --no-strip -p chainflip-node --deb-revision "${DEB_REVISION}" --variant="${NETWORK}"
          cargo deb -v --no-build --no-strip -p engine-runner --deb-revision "${DEB_REVISION}" --variant="${NETWORK}"
          cargo deb -v --no-build --no-strip -p chainflip-cli --deb-revision "${DEB_REVISION}"

      - name: Upload packages 📤
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chainflip-backend-packages
          path: |
            target/debian/*.deb
