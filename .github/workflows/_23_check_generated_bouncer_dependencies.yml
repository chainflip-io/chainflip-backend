name: Ensure generated bouncer dependencies are up to date

on:
  workflow_call:

permissions:
  packages: read
  contents: read

jobs:
  check-generated-bouncer-dependencies:
    runs-on: namespace-profile-default
    steps:
      - name: Checkout chainflip-backend 🛒
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show git status
        run: |
          git status
          git status --porcelain

      - name: Download Binaries 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chainflip-backend-bin

      - name: Make Binaries Executable 🛠️
        run: |
          chmod +x chainflip-*

      - name: Configure NodeJS 🛠️
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./bouncer/.nvmrc
          cache-dependency-path: "bouncer/pnpm-lock.yaml"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Install node dependencies 📦
        working-directory: bouncer
        run: pnpm install

      - name: Run Test 🧪
        shell: bash
        run: ./ci/scripts/check_generated_bouncer_dependencies.sh
