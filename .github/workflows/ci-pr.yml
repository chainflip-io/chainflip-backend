name: CI PR
on:
  pull_request:

env:
  FORCE_COLOR: 1

jobs:
  check-semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for semantic PR 📝
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
