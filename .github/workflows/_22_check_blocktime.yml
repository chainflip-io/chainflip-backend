name: Ensure block time is 6000ms for production builds

on:
  workflow_call:

permissions:
  packages: read
  contents: read

jobs:
  check-blocktime:
    runs-on: namespace-profile-default-light
    steps:
      - name: Checkout chainflip-backend 🛒
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Binaries 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chainflip-backend-bin

      - name: Make Binaries Executable 🛠️
        run: |
          chmod +x chainflip-*

      - name: Run Test 🧪
        shell: bash
        run: ./ci/scripts/check_blocktime.sh
