# This CI runs a lot of the jobs in parallel to speed up development time. We also run a simpler suite of bouncer tests.
name: Release Chainflip Development
on: pull_request
concurrency:
    group: ${{ github.ref }}-release-development
    cancel-in-progress: true

jobs:
    pre-check:
        uses: ./.github/workflows/_01_pre_check.yml
        secrets: inherit
    force-version-bump:
        needs: pre-check
        uses: ./.github/workflows/_05_force_version_bump.yml
        secrets: inherit
        with:
            network-to-check-against: "sisyphos"
    test:
        needs: pre-check
        uses: ./.github/workflows/_10_test.yml
        secrets: inherit
    coverage:
        needs: pre-check
        uses: ./.github/workflows/_11_coverage.yml
        with:
            test_features: runtime-benchmarks
        secrets: inherit
    build:
        needs: pre-check
        uses: ./.github/workflows/_20_build.yml
        secrets: inherit
        with:
            profile: "release"
    build-turbo:
        needs: pre-check
        uses: ./.github/workflows/_20_build.yml
        secrets: inherit
        with:
            profile: "release-turbo"
            upload-name: "chainflip-backend-bin-turbo"
    # Used to test upgrades to this version from the latest release
    build-try-runtime:
        needs: pre-check
        uses: ./.github/workflows/_20_build.yml
        secrets: inherit
        with:
            profile: "try-runtime"
            upload-name: "chainflip-backend-bin-try-runtime"
            binary-subdir: release
    build-benchmarks:
        needs: pre-check
        uses: ./.github/workflows/_20_build.yml
        secrets: inherit
        with:
            profile: "benchmarks"
            upload-name: "chainflip-backend-bin-benchmarks"
            binary-subdir: release
    check-generated-bouncer-dependencies:
        needs: [build]
        uses: ./.github/workflows/_23_check_generated_bouncer_dependencies.yml
        secrets: inherit
    docker:
        needs: [build]
        uses: ./.github/workflows/_24_docker.yml
        secrets: inherit
        with:
            network: "test"
            environment: "development"
    package:
        needs: [build]
        uses: ./.github/workflows/_25_package.yml
        with:
            network: "test"
        secrets: inherit
    provision-bouncer-runner:
        needs: pre-check
        uses: ./.github/workflows/_39_provision_bouncer_runner.yml
        secrets: inherit
    post-check:
        needs: [build, provision-bouncer-runner]
        # Runs even when the build fails, so that the provisioned runner is destroyed.
        if: ${{ always() && needs.provision-bouncer-runner.result != 'skipped' }}
        uses: ./.github/workflows/_40_post_check.yml
        secrets: inherit
        with:
            full-bouncer: false
            ngrok: true
            build-result: ${{ needs.build.result }}
            runner-label: ${{ needs.provision-bouncer-runner.outputs.runner-label }}
            runner-name: ${{ needs.provision-bouncer-runner.outputs.runner-name }}
            server-id: ${{ needs.provision-bouncer-runner.outputs.server-id }}
    provision-bouncer-runner-turbo:
        needs: pre-check
        uses: ./.github/workflows/_39_provision_bouncer_runner.yml
        secrets: inherit
        with:
            log-postfix: "-turbo"
    post-check-turbo:
        needs: [build-turbo, provision-bouncer-runner-turbo]
        # Runs even when the build fails, so that the provisioned runner is destroyed.
        if: ${{ always() && needs.provision-bouncer-runner-turbo.result != 'skipped' }}
        uses: ./.github/workflows/_40_post_check.yml
        secrets: inherit
        with:
            full-bouncer: false
            ngrok: true
            chainflip-backend-bin-suffix: -turbo
            log-postfix: "-turbo"
            continue-on-bouncer-error: true
            build-result: ${{ needs.build-turbo.result }}
            runner-label: ${{ needs.provision-bouncer-runner-turbo.outputs.runner-label }}
            runner-name: ${{ needs.provision-bouncer-runner-turbo.outputs.runner-name }}
            server-id: ${{ needs.provision-bouncer-runner-turbo.outputs.server-id }}
    provision-bouncer-runner-old-rpcs:
        needs: pre-check
        uses: ./.github/workflows/_39_provision_bouncer_runner.yml
        secrets: inherit
        with:
            log-postfix: "-post-check-old-rpcs"
    post-check-old-rpcs:
        needs: [build, provision-bouncer-runner-old-rpcs]
        # Runs even when the build fails, so that the provisioned runner is destroyed.
        if: ${{ always() && needs.provision-bouncer-runner-old-rpcs.result != 'skipped' }}
        uses: ./.github/workflows/_40_post_check.yml
        secrets: inherit
        with:
            full-bouncer: false
            ngrok: true
            broker-endpoint: "http://127.0.0.1:10997"
            lp-endpoint: "http://127.0.0.1:10589"
            log-postfix: "-post-check-old-rpcs"
            build-result: ${{ needs.build.result }}
            runner-label: ${{ needs.provision-bouncer-runner-old-rpcs.outputs.runner-label }}
            runner-name: ${{ needs.provision-bouncer-runner-old-rpcs.outputs.runner-name }}
            server-id: ${{ needs.provision-bouncer-runner-old-rpcs.outputs.server-id }}
    test-benchmarks:
        needs: [build-benchmarks]
        uses: ./.github/workflows/_41_test_benchmarks.yml
        secrets:
            CF_GITHUB_RUNNERS_MANAGEMENT_TOKEN: ${{ secrets.CF_GITHUB_RUNNERS_MANAGEMENT_TOKEN }}
            CF_HETZNER_API_TOKEN: ${{ secrets.CF_HETZNER_API_TOKEN }}
    upgrade-check:
        needs: [build-try-runtime]
        uses: ./.github/workflows/upgrade-test.yml
        secrets: inherit
        with:
            run-job: false
    publish:
        needs: [package]
        uses: ./.github/workflows/_30_publish.yml
        with:
            version: ci/${{ github.sha }}/
            environment: "development"
        secrets: inherit
    upload-versioned-build-artifacts:
        needs: [build]
        uses: ./.github/workflows/_61_upload_versioned_build_artifacts.yml
        secrets: inherit
        with:
            is_release: false
            is_development: true
