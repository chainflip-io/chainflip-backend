# Only cheap checks run here, to keep the queue fast. Bouncer, upgrade and benchmark tests run on
# main after merge, in ci-main-e2e.yml.
name: Chainflip Main Merge Queue
on:
  merge_group:

jobs:
  pre-check:
    uses: ./.github/workflows/_01_pre_check.yml
    secrets: inherit
  test:
    needs: pre-check
    uses: ./.github/workflows/_10_test.yml
    secrets: inherit
  build:
    needs: pre-check
    uses: ./.github/workflows/_20_build.yml
    secrets: inherit
    with:
      profile: "release"
  # Catches runtime changes merged alongside stale generated bouncer types, which pass on each PR alone.
  check-generated-bouncer-dependencies:
    needs: [build]
    uses: ./.github/workflows/_23_check_generated_bouncer_dependencies.yml
    secrets: inherit
