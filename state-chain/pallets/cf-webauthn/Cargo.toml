[package]
name = "pallet-cf-webauthn"
version = "0.1.0"
authors = ["Chainflip Team <https://github.com/chainflip-io>"]
description = "Registry of attested WebAuthn credentials and a transaction extension to sign with them"
edition = "2021"
homepage = "https://chainflip.io"
license = "Apache-2.0"
publish = false
repository = "https://github.com/chainflip-io/chainflip-backend"

[lints]
workspace = true

[dependencies]
cf-webauthn = { workspace = true }

codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

[dev-dependencies]
cf-webauthn = { workspace = true, default-features = true, features = ["test-utils"] }
hex = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"cf-webauthn/std",
	"frame-benchmarking?/std",
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-io/std",
	"sp-runtime/std",
	"sp-std/std",
]
runtime-benchmarks = [
	"dep:frame-benchmarking",
	"frame-benchmarking/runtime-benchmarks",
	"cf-webauthn/test-utils",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
]
